# Fidelity-ablation campaign for the TTN-oriented LoRaWAN reference.
#
# All treatments use the same ADR, three EU868 channels, propagation, traffic,
# seeds, accounting, warm-up window and complete radio-energy integrator. Each
# cumulative stage changes exactly one recovered fidelity behavior.
include Analisis-mi-PROPOSAL-ADR.ini

[Config FidelityAblationBase]
description = "Common TTN-oriented three-channel reference for fidelity ablations"
sim-time-limit = 12d
warmup-period = 2d
repeat = 5
**.numberOfNodes = ${nodes=100,200,300,400,500,600,700,800,900,1000}
**.networkServer.app[0].adrAlgorithm = "lorawanReference"
**.networkServer.app[0].adrMethod = "max"
**.networkServer.app[0].adrWindowSize = 20
**.networkServer.app[0].adrDeviceMargin = 15
**.networkServer.app[0].adrStepSize = 2.5dB
**.networkServer.app[0].useCsiNotificationsForAdr = false
**.useAllEu868Channels = false
**.heartbeatInterval = 0s
**.enforceDutyCycle = true
**.gatewayDutyCycle = 0.01

# F0: established common testbed with the recovered pre-correction behavior
# only for noise, the final SNIR gate, time on air, gateway waiting and the
# floating-watt TX-current lookup.
[Config FidelityF0LegacyStatic]
extends = FidelityAblationBase
description = "F0: TTN reference with recovered pre-fidelity behavior, static"
**.backgroundNoiseModel = "legacySensitivity"
**.enforceRequiredSnr = false
**.airtimeModel = "legacyFixedPayload"
**.dutyCycleModel = "legacySfConstants"
**.txCurrentLookupModel = "legacyExactWatts"
**.loRaNodes[*].mobile = false
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f0-legacy-static-n${nodes}-r${repetition}.sca

# F1 adds the bandwidth-based kTB+NF background-noise model.
[Config FidelityF1ThermalNoiseStatic]
extends = FidelityF0LegacyStatic
description = "F1: F0 plus thermal background noise, static"
**.backgroundNoiseModel = "thermal"
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f1-noise-static-n${nodes}-r${repetition}.sca

# F2 additionally enforces the SF-specific minimum packet SNIR.
[Config FidelityF2SnrReceptionStatic]
extends = FidelityF1ThermalNoiseStatic
description = "F2: F1 plus SF-specific SNIR reception gate, static"
**.enforceRequiredSnr = true
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f2-reception-static-n${nodes}-r${repetition}.sca

# F3 replaces fixed payload timing and DE=0 with actual-PHY-byte Semtech ToA.
[Config FidelityF3SemtechToaStatic]
extends = FidelityF2SnrReceptionStatic
description = "F3: F2 plus Semtech-compatible physical ToA, static"
**.airtimeModel = "semtech"
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f3-toa-static-n${nodes}-r${repetition}.sca

# F4 derives the gateway start-to-start holdoff from actual downlink ToA/0.01.
[Config FidelityF4ToaDutyCycleStatic]
extends = FidelityF3SemtechToaStatic
description = "F4: F3 plus actual-ToA one-percent gateway duty cycle, static"
**.dutyCycleModel = "toa"
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f4-duty-static-n${nodes}-r${repetition}.sca

# F5 uses integer-dBm/nearest-calibration TX-current selection. Correct W/J
# signal semantics and complete post-warm-up integration remain the common
# measurement instrument; their unit contract is validated deterministically.
[Config FidelityF5EnhancedStatic]
extends = FidelityF4ToaDutyCycleStatic
description = "F5: complete selected Enhanced FLoRa fidelity corrections, static"
**.txCurrentLookupModel = "dbmNearest"
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f5-enhanced-static-n${nodes}-r${repetition}.sca

# RandomWaypoint versions. Only the population model changes.
[Config FidelityF0LegacyMobile]
extends = FidelityF0LegacyStatic
description = "F0: TTN reference with recovered pre-fidelity behavior, mobile"
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f0-legacy-mobile-n${nodes}-r${repetition}.sca

[Config FidelityF1ThermalNoiseMobile]
extends = FidelityF1ThermalNoiseStatic
description = "F1: F0 plus thermal background noise, mobile"
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f1-noise-mobile-n${nodes}-r${repetition}.sca

[Config FidelityF2SnrReceptionMobile]
extends = FidelityF2SnrReceptionStatic
description = "F2: F1 plus SF-specific SNIR reception gate, mobile"
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f2-reception-mobile-n${nodes}-r${repetition}.sca

[Config FidelityF3SemtechToaMobile]
extends = FidelityF3SemtechToaStatic
description = "F3: F2 plus Semtech-compatible physical ToA, mobile"
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f3-toa-mobile-n${nodes}-r${repetition}.sca

[Config FidelityF4ToaDutyCycleMobile]
extends = FidelityF4ToaDutyCycleStatic
description = "F4: F3 plus actual-ToA one-percent gateway duty cycle, mobile"
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f4-duty-mobile-n${nodes}-r${repetition}.sca

[Config FidelityF5EnhancedMobile]
extends = FidelityF5EnhancedStatic
description = "F5: complete selected Enhanced FLoRa fidelity corrections, mobile"
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f5-enhanced-mobile-n${nodes}-r${repetition}.sca

# Exact 50/50 mixed versions. Explicitly reset the all-mobile assignment
# inherited by neither branch and let the network choose trajectories by index.
[Config FidelityF0LegacyMixed]
extends = FidelityAblationBase
description = "F0: TTN reference with recovered pre-fidelity behavior, mixed"
**.backgroundNoiseModel = "legacySensitivity"
**.enforceRequiredSnr = false
**.airtimeModel = "legacyFixedPayload"
**.dutyCycleModel = "legacySfConstants"
**.txCurrentLookupModel = "legacyExactWatts"
**.mixedMobility = true
**.mobileNodeFraction = 0.5
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f0-legacy-mixed-n${nodes}-r${repetition}.sca

[Config FidelityF1ThermalNoiseMixed]
extends = FidelityF0LegacyMixed
description = "F1: F0 plus thermal background noise, mixed"
**.backgroundNoiseModel = "thermal"
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f1-noise-mixed-n${nodes}-r${repetition}.sca

[Config FidelityF2SnrReceptionMixed]
extends = FidelityF1ThermalNoiseMixed
description = "F2: F1 plus SF-specific SNIR reception gate, mixed"
**.enforceRequiredSnr = true
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f2-reception-mixed-n${nodes}-r${repetition}.sca

[Config FidelityF3SemtechToaMixed]
extends = FidelityF2SnrReceptionMixed
description = "F3: F2 plus Semtech-compatible physical ToA, mixed"
**.airtimeModel = "semtech"
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f3-toa-mixed-n${nodes}-r${repetition}.sca

[Config FidelityF4ToaDutyCycleMixed]
extends = FidelityF3SemtechToaMixed
description = "F4: F3 plus actual-ToA one-percent gateway duty cycle, mixed"
**.dutyCycleModel = "toa"
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f4-duty-mixed-n${nodes}-r${repetition}.sca

[Config FidelityF5EnhancedMixed]
extends = FidelityF4ToaDutyCycleMixed
description = "F5: complete selected Enhanced FLoRa fidelity corrections, mixed"
**.txCurrentLookupModel = "dbmNearest"
output-scalar-file = ../results/fidelity-ablation-20260909/scalars/f5-enhanced-mixed-n${nodes}-r${repetition}.sca

# Sensitivity-only reference at the three preregistered anchor densities.
[Config FidelityStep3SensitivityStatic]
extends = FidelityF0LegacyStatic
description = "F0 sensitivity: historical 3-dB NStep divisor, static anchors"
constraint = $nodes == 100 || $nodes == 500 || $nodes == 1000
**.networkServer.app[0].adrStepSize = 3dB
output-scalar-file = ../results/fidelity-ablation-20260909/sensitivity/f0-step3-static-n${nodes}-r${repetition}.sca

[Config FidelityStep3SensitivityMobile]
extends = FidelityF0LegacyMobile
description = "F0 sensitivity: historical 3-dB NStep divisor, mobile anchors"
constraint = $nodes == 100 || $nodes == 500 || $nodes == 1000
**.networkServer.app[0].adrStepSize = 3dB
output-scalar-file = ../results/fidelity-ablation-20260909/sensitivity/f0-step3-mobile-n${nodes}-r${repetition}.sca

[Config FidelityStep3SensitivityMixed]
extends = FidelityF0LegacyMixed
description = "F0 sensitivity: historical 3-dB NStep divisor, mixed anchors"
constraint = $nodes == 100 || $nodes == 500 || $nodes == 1000
**.networkServer.app[0].adrStepSize = 3dB
output-scalar-file = ../results/fidelity-ablation-20260909/sensitivity/f0-step3-mixed-n${nodes}-r${repetition}.sca

# Short treatment-path checks. These exercise traffic and ADR but never write
# into the campaign scalar directory. The validator also checks their effective
# parameters and emitted treatment codes.
[Config FidelityValidateF0]
extends = FidelityF0LegacyStatic
description = "Validation path for F0"
constraint = $nodes == 100
sim-time-limit = 30min
warmup-period = 0s
repeat = 1
**.numberOfNodes = 12
**.numberOfPacketsToSend = 30
**.timeToFirstPacket = 2s
**.timeToNextPacket = 20s
**.randomizeInitialRadioParameters = false
**.initialLoRaSF = 12
**.initialLoRaTP = 14dBm
output-scalar-file = ../results/fidelity-ablation-20260909/validation/f0.sca

[Config FidelityValidateF1]
extends = FidelityF1ThermalNoiseStatic
description = "Validation path for F1"
constraint = $nodes == 100
sim-time-limit = 30min
warmup-period = 0s
