[General]
network = flora.simulations.LoRaNetworkTest
rng-class = "cMersenneTwister"
simtime-resolution = -11

**.scalar-recording = true
**.vector-recording = false
**.statistic-recording = true
**.maxTransmissionDuration = 4s

# Gateway to network-server transport
**.loRaGW[*].numUdpApps = 1
**.loRaGW[*].packetForwarder.localPort = 2000
**.loRaGW[*].packetForwarder.destPort = 1000
**.loRaGW[*].packetForwarder.destAddresses = "networkServer"
**.loRaGW[*].packetForwarder.indexNumber = 0
**.networkServer.numApps = 1
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].localPort = 1000
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].adrMethod = "max"
**.networkServer.app[0].adrDeviceMargin = 15
**.networkServer.app[0].adrWindowSize = 20
**.networkServer.app[0].proposalMaxDistance = 15000m
**.networkServer.app[0].adrAlgorithm = "thesisLegacy"
**.networkServer.app[0].adaptiveMobilityAdr = false
**.networkServer.app[0].energyConfigFile = xmldoc("../energyConsumptionParameters.xml")
**.networkServer.**.evaluateADRinServer = true

# Thesis traffic and EU868 radio parameters
**.numberOfPacketsToSend = 0
**.dataSize = 20B
**.timeToFirstPacket = exponential(1000s)
**.timeToNextPacket = exponential(1000s)
**.heartbeatInterval = 6h
**.evaluateADRinNode = true
**.randomizeInitialRadioParameters = true
**.useAllEu868Channels = true
**.initialLoRaBW = 125kHz
**.initialLoRaCR = 4
**.alohaChannelModel = false

# Mobility switch. false reproduces the static circular thesis testbed; true
# selects INET RandomWaypoint over the same 30 km x 30 km constraint area.
# Homogeneous configs override node.mobile. Mixed configs use the network-level
# fraction, which assigns the first fraction to RandomWaypoint deterministically.
**.mixedMobility = false
**.mobileNodeFraction = 0.5
**.loRaNodes[*].mobility.speed = uniform(0.5mps, 3mps)
**.loRaNodes[*].mobility.waitTime = uniform(0s, 60s)
**.loRaNodes[*].mobility.updateInterval = 1s

# Static circular deployment used when mobile=false.
**.loRaNodes[*].**.initFromDisplayString = false
**.loRaNodes[*].deploymentType = "circle"
**.loRaNodes[*].maxGatewayDistance = 15000
**.loRaNodes[*].gatewayX = 15000
**.loRaNodes[*].gatewayY = 15000
**.numberOfGateways = 1
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 30000m
**.constraintAreaMaxY = 30000m
**.constraintAreaMaxZ = 0m
**.loRaGW[0].**.initialX = 15000m
**.loRaGW[0].**.initialY = 15000m
**.loRaGW[*].**.initFromDisplayString = false
**.LoRaGWNic.radio.iAmGateway = true

# FLNS-Friis suburban model. Friis anchors PL(d0); gamma and sigma
# represent the large-scale environment described in the papers.
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLoss.typename = "LoRaLogNormalShadowing"
**.LoRaMedium.pathLoss.d0 = 1000m
**.LoRaMedium.pathLoss.gamma = 2.32
**.LoRaMedium.pathLoss.sigma = 7.08
**.LoRaMedium.pathLoss.useFriisReference = true
**.LoRaMedium.pathLoss.referenceFrequency = 868MHz
**.LoRaMedium.pathLoss.systemLoss = 0dB
**.LoRaMedium.pathLoss.transmitterGain = 1
**.LoRaMedium.pathLoss.receiverGain = 1
**.minInterferenceTime = 0s

LoRaNetworkTest.**.radio.separateTransmissionParts = false
LoRaNetworkTest.**.radio.separateReceptionParts = false
**.ipv4Delayer.config = xmldoc("../cloudDelays.xml")
**.displayAddresses = false

# Energy model used for UE, Eattempt and WEIndex.
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
# Path is relative to radio.energyConsumer; the storage is its sibling.
**.loRaNodes[*].LoRaNic.radio.energyConsumer.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].**.energySourceModule = "IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("../energyConsumptionParameters.xml")

[Config ThesisSmoke]
description = "Short integration test: uplinks, heartbeat, CSI notification and ADR downlink"
sim-time-limit = 8h
warmup-period = 1h
repeat = 1
**.numberOfNodes = 10
output-scalar-file = ../results/thesis-smoke-${runnumber}.sca

[Config ThesisCsiSmoke]
description = "Short stress test for reception-failure classification and CSI path"
sim-time-limit = 3h
warmup-period = 30min
repeat = 1
**.numberOfNodes = 300
**.randomizeInitialRadioParameters = false
**.initialLoRaSF = 7
**.initialLoRaTP = 14dBm
output-scalar-file = ../results/thesis-csi-smoke-${runnumber}.sca

[Config EnergyValidation]
description = "One-packet SF7/14-dBm regression for ToA and radio energy"
sim-time-limit = 30s
warmup-period = 0s
repeat = 1
**.numberOfNodes = 1
**.numberOfPacketsToSend = 1
**.timeToFirstPacket = 1s
**.heartbeatInterval = 0s
**.evaluateADRinNode = false
**.networkServer.**.evaluateADRinServer = false
**.randomizeInitialRadioParameters = false
**.initialLoRaSF = 7
**.initialLoRaTP = 14dBm
**.loRaNodes[*].mobile = false
output-scalar-file = ../results/energy-validation-${runnumber}.sca

[Config ThesisProposalS1]
description = "Published static ADR scenario S1"
sim-time-limit = 12d
warmup-period = 2d
repeat = 5
**.numberOfNodes = ${nodes=100..1000 step 100}
**.networkServer.app[0].adrAlgorithm = "thesisLegacy"
output-scalar-file = ../results/thesis-legacy-static-s1-n${nodes}-r${repetition}.sca

[Config ThesisProposalS2]
description = "Published large-scale static ADR scenario S2"
sim-time-limit = 12d
warmup-period = 2d
repeat = 5
**.numberOfNodes = ${nodes=1000..5000 step 1000}
**.networkServer.app[0].adrAlgorithm = "thesisLegacy"
output-scalar-file = ../results/thesis-proposal-s2-n${nodes}-r${repetition}.sca

[Config ThesisProposalMobileS1]
description = "Published S1 population with RandomWaypoint mobility"
extends = ThesisProposalS1
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/thesis-legacy-mobile-s1-n${nodes}-r${repetition}.sca

[Config ThesisProposalMobileS2]
description = "Published S2 population with RandomWaypoint mobility"
extends = ThesisProposalS2
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/thesis-proposal-mobile-s2-n${nodes}-r${repetition}.sca

[Config ThesisProposalMixedS1]
description = "Published thesis ADR in a 50-percent RandomWaypoint population"
extends = ThesisProposalS1
**.mixedMobility = true
**.mobileNodeFraction = 0.5
output-scalar-file = ../results/thesis-legacy-mixed-s1-n${nodes}-r${repetition}.sca

# ---------------------------------------------------------------------------
# LoRaWAN/Semtech reference NS-ADR from the thesis and companion papers
# ---------------------------------------------------------------------------
# SNRmax of the last 20 ULs, 15-dB device margin and 3-dB steps. Positive
# steps reduce SF first and then TP; negative steps increase TP. Heartbeats are
# disabled because they are not part of the reference algorithm.

[Config LoRaWanReferenceStaticS1]
description = "Corrected LoRaWAN reference ADR, static S1"
extends = ThesisProposalS1
**.networkServer.app[0].adrAlgorithm = "lorawanReference"
**.heartbeatInterval = 0s
output-scalar-file = ../results/lorawan-reference-static-s1-n${nodes}-r${repetition}.sca

[Config LoRaWanReferenceStaticS2]
description = "Corrected LoRaWAN reference ADR, static S2"
extends = ThesisProposalS2
**.networkServer.app[0].adrAlgorithm = "lorawanReference"
**.heartbeatInterval = 0s
output-scalar-file = ../results/lorawan-reference-static-s2-n${nodes}-r${repetition}.sca

[Config LoRaWanReferenceMobileS1]
description = "Corrected LoRaWAN reference ADR with RandomWaypoint S1"
extends = LoRaWanReferenceStaticS1
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/lorawan-reference-mobile-s1-n${nodes}-r${repetition}.sca

[Config LoRaWanReferenceMixedS1]
description = "Corrected LoRaWAN reference ADR, 50-percent mobile S1"
extends = LoRaWanReferenceStaticS1
**.mixedMobility = true
**.mobileNodeFraction = 0.5
output-scalar-file = ../results/lorawan-reference-mixed-s1-n${nodes}-r${repetition}.sca

# ---------------------------------------------------------------------------
# Mobility-adapted, bidirectional energy ADR
# ---------------------------------------------------------------------------
# These configurations opt in explicitly; the thesis baseline above remains
# unchanged. Static nodes use a long decision window and 10 dB margin. Mobile
# or not-yet-classified nodes use a short EWMA window, 15 dB margin and SF
# distance-band hysteresis. All modes minimize expected joules per successful
# delivery and suppress downlinks whose radio and heartbeat controls are no-op.
# Three consecutive degraded observations are required before the heartbeat is
# shortened, preventing isolated 7.08-dB shadow-fading samples from oscillating
# the control interval in an otherwise static link.

[Config MobilityEnergyAdrStaticS1]
description = "Energy-oriented ADR for temporally classified static nodes"
extends = ThesisProposalS1
**.networkServer.app[0].adrAlgorithm = "mobilityEnergy"
**.networkServer.app[0].deteriorationConfirmationSamples = 3
**.heartbeatOnlyWhenDataSilent = true
**.loRaNodes[*].mobile = false
output-scalar-file = ../results/mobility-energy-adr-static-s1-n${nodes}-r${repetition}.sca

[Config MobilityEnergyAdrStaticS2]
description = "Energy-oriented ADR for temporally classified static nodes"
extends = ThesisProposalS2
**.networkServer.app[0].adrAlgorithm = "mobilityEnergy"
**.heartbeatOnlyWhenDataSilent = true
**.loRaNodes[*].mobile = false
output-scalar-file = ../results/mobility-energy-adr-static-s2-n${nodes}-r${repetition}.sca

[Config MobilityEnergyAdrMobileS1]
description = "Mobility-aware energy ADR with RandomWaypoint nodes"
extends = ThesisProposalMobileS1
**.networkServer.app[0].adrAlgorithm = "mobilityEnergy"
**.heartbeatOnlyWhenDataSilent = true
**.loRaNodes[*].mobile = true
output-scalar-file = ../results/mobility-energy-adr-mobile-s1-n${nodes}-r${repetition}.sca

[Config MobilityEnergyAdrMixedS1]
description = "Energy-oriented ADR with a 50-percent RandomWaypoint population"
extends = ThesisProposalS1
**.networkServer.app[0].adrAlgorithm = "mobilityEnergy"
**.heartbeatOnlyWhenDataSilent = true
**.mixedMobility = true
**.mobileNodeFraction = 0.5
output-scalar-file = ../results/mobility-energy-adr-mixed-s1-n${nodes}-r${repetition}.sca

# Small deterministic integrations tests. They are not validity experiments;
# they exercise classification, heartbeat commands, hysteresis and energy ADR
# in minutes before running the 12-day scenarios.
[Config MobilityEnergyAdrSmokeStatic]
description = "Short implementation check for static classification and energy ADR"
sim-time-limit = 20min
warmup-period = 0s
repeat = 1
**.numberOfNodes = 3
**.numberOfPacketsToSend = 35
# Stagger the three deterministic streams so their ADR downlinks do not all
# contend for the single gateway at the same instant.
**.timeToFirstPacket = uniform(2s, 20s)
**.timeToNextPacket = 30s
**.heartbeatInterval = 5min
**.heartbeatOnlyWhenDataSilent = true
**.randomizeInitialRadioParameters = false
**.initialLoRaSF = 12
**.initialLoRaTP = 14dBm
**.loRaNodes[*].mobile = false
**.networkServer.app[0].adrAlgorithm = "mobilityEnergy"
**.networkServer.app[0].activeHeartbeatInterval = 2min
**.networkServer.app[0].stableHeartbeatInterval = 10min
**.networkServer.app[0].initialHeartbeatInterval = 5min
# Isolate the static-heartbeat assertion from random shadow-fading excursions;
# deterioration behavior remains active with its paper defaults in full runs.
**.networkServer.app[0].deteriorationSnrDrop = 100dB
**.networkServer.app[0].deteriorationRssiDrop = 100dB
output-scalar-file = ../results/mobility-energy-adr-smoke-static-${runnumber}.sca

[Config MobilityEnergyAdrSmokeMobile]
description = "Short implementation check for RandomWaypoint classification and hysteresis"
extends = MobilityEnergyAdrSmokeStatic
**.loRaNodes[*].mobile = true
**.loRaNodes[*].mobility.speed = uniform(5mps, 10mps)
**.loRaNodes[*].mobility.waitTime = 0s
**.networkServer.app[0].deteriorationSnrDrop = 3dB
**.networkServer.app[0].deteriorationRssiDrop = 6dB
output-scalar-file = ../results/mobility-energy-adr-smoke-mobile-${runnumber}.sca

# ---------------------------------------------------------------------------
# Three-ADR smoke matrix: 4 nodes, 20 simulated minutes, sequential execution
# ---------------------------------------------------------------------------
[Config ThreeAdrSmokeBase]
description = "Common short test parameters; not a validity experiment"
sim-time-limit = 20min
warmup-period = 0s
repeat = 1
**.numberOfNodes = 4
**.numberOfPacketsToSend = 35
**.timeToFirstPacket = uniform(2s, 20s)
**.timeToNextPacket = 30s
**.randomizeInitialRadioParameters = false
**.initialLoRaSF = 12
**.initialLoRaTP = 14dBm
**.mixedMobility = false

[Config LoRaWanReferenceSmokeStatic]
extends = ThreeAdrSmokeBase
**.networkServer.app[0].adrAlgorithm = "lorawanReference"
**.heartbeatInterval = 0s
output-scalar-file = ../results/lorawan-reference-smoke-static-${runnumber}.sca

[Config LoRaWanReferenceSmokeMobile]
extends = LoRaWanReferenceSmokeStatic
**.loRaNodes[*].mobile = true
**.loRaNodes[*].mobility.speed = uniform(5mps, 10mps)
**.loRaNodes[*].mobility.waitTime = 0s
output-scalar-file = ../results/lorawan-reference-smoke-mobile-${runnumber}.sca

[Config LoRaWanReferenceSmokeMixed]
extends = LoRaWanReferenceSmokeStatic
**.mixedMobility = true
**.mobileNodeFraction = 0.5
**.loRaNodes[*].mobility.speed = uniform(5mps, 10mps)
**.loRaNodes[*].mobility.waitTime = 0s
output-scalar-file = ../results/lorawan-reference-smoke-mixed-${runnumber}.sca

[Config ThesisLegacySmokeStatic]
extends = ThreeAdrSmokeBase
**.networkServer.app[0].adrAlgorithm = "thesisLegacy"
**.heartbeatInterval = 5min
output-scalar-file = ../results/thesis-legacy-smoke-static-${runnumber}.sca

[Config ThesisLegacySmokeMobile]
extends = ThesisLegacySmokeStatic
**.loRaNodes[*].mobile = true
**.loRaNodes[*].mobility.speed = uniform(5mps, 10mps)
**.loRaNodes[*].mobility.waitTime = 0s
output-scalar-file = ../results/thesis-legacy-smoke-mobile-${runnumber}.sca

[Config ThesisLegacySmokeMixed]
extends = ThesisLegacySmokeStatic
**.mixedMobility = true
**.mobileNodeFraction = 0.5
**.loRaNodes[*].mobility.speed = uniform(5mps, 10mps)
**.loRaNodes[*].mobility.waitTime = 0s
output-scalar-file = ../results/thesis-legacy-smoke-mixed-${runnumber}.sca

[Config MobilityEnergySmokeStatic]
extends = ThreeAdrSmokeBase
**.networkServer.app[0].adrAlgorithm = "mobilityEnergy"
**.heartbeatInterval = 5min
**.heartbeatOnlyWhenDataSilent = true
**.networkServer.app[0].activeHeartbeatInterval = 2min
**.networkServer.app[0].stableHeartbeatInterval = 10min
**.networkServer.app[0].initialHeartbeatInterval = 5min
**.networkServer.app[0].deteriorationSnrDrop = 100dB
**.networkServer.app[0].deteriorationRssiDrop = 100dB
output-scalar-file = ../results/mobility-energy-smoke-static-${runnumber}.sca

[Config MobilityEnergySmokeMobile]
extends = MobilityEnergySmokeStatic
**.loRaNodes[*].mobile = true
**.loRaNodes[*].mobility.speed = uniform(5mps, 10mps)
**.loRaNodes[*].mobility.waitTime = 0s
**.networkServer.app[0].deteriorationSnrDrop = 3dB
**.networkServer.app[0].deteriorationRssiDrop = 6dB
output-scalar-file = ../results/mobility-energy-smoke-mobile-${runnumber}.sca

[Config MobilityEnergySmokeMixed]
extends = MobilityEnergySmokeStatic
**.mixedMobility = true
**.mobileNodeFraction = 0.5
**.loRaNodes[*].mobility.speed = uniform(5mps, 10mps)
**.loRaNodes[*].mobility.waitTime = 0s
**.networkServer.app[0].deteriorationSnrDrop = 3dB
**.networkServer.app[0].deteriorationRssiDrop = 6dB
output-scalar-file = ../results/mobility-energy-smoke-mixed-${runnumber}.sca

[Config MobilityEnergyHeartbeatIdleSmoke]
description = "Keepalive regression: data suppresses heartbeat, silence permits it"
extends = MobilityEnergySmokeMobile
**.numberOfNodes = 1
**.numberOfPacketsToSend = 2
**.timeToFirstPacket = 2s
**.timeToNextPacket = 10min
output-scalar-file = ../results/mobility-energy-heartbeat-idle-smoke-${runnumber}.sca
