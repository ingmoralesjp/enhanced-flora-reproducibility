include /tmp/enhanced-flora-native-reproduction-v2/energy-source/simulations/examples/fidelity-ablation.ini

[Config ComponentAuditPortable]
extends = FidelityF5EnhancedStatic
network = flora.ComponentAuditNetwork
repeat = 1
