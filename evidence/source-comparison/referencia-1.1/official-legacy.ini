[General]
network = LoRaNetworkTest
rng-class = "cMersenneTwister"
num-rngs = 4
seed-set = 0
simtime-resolution = -11
sim-time-limit = 12d
warmup-period = 2d

**.scalar-recording = true
**.vector-recording = false
**.statistic-recording = true
**.maxTransmissionDuration = 4s
**.energyDetection = -110dBm

# One gateway and the official FLoRa 1.1 network-server path.
**.numberOfGateways = 1
**.loRaGW[*].numUdpApps = 1
**.loRaGW[0].packetForwarder.localPort = 2000
**.loRaGW[0].packetForwarder.destPort = 1000
**.loRaGW[0].packetForwarder.destAddresses = "networkServer"
**.loRaGW[0].packetForwarder.indexNumber = 0
**.networkServer.numApps = 1
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].localPort = 1000
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].adrMethod = "max"
**.networkServer.app[0].adrDeviceMargin = 15
**.networkServer.**.evaluateADRinServer = true

# Common high-level study inputs. The official source retains its native
# traffic holdoff, airtime, gateway duty-cycle, receiver, and ADR mechanics.
**.numberOfPacketsToSend = 0
**.dataSize = 20B
**.timeToFirstPacket = exponential(1000s, 1)
**.timeToNextPacket = exponential(1000s, 1)
**.evaluateADRinNode = true
**.alohaChannelModel = false

# Static uniform disk, radius 15 km, centered on the single gateway.
**.numberOfNodes = 100
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 30000m
**.constraintAreaMaxY = 30000m
**.constraintAreaMaxZ = 0m
**.loRaNodes[*].deploymentType = "circle"
**.loRaNodes[*].maxGatewayDistance = 15000
**.loRaNodes[*].gatewayX = 15000
**.loRaNodes[*].gatewayY = 15000
**.loRaNodes[*].**.initFromDisplayString = false
**.loRaGW[0].**.initialX = 15000m
**.loRaGW[0].**.initialY = 15000m
**.loRaGW[*].**.initFromDisplayString = false
**.LoRaGWNic.radio.iAmGateway = true

# Distribution-matched initialization. These are INI inputs only: the
# official FLoRa 1.1 source and libflora binary remain unchanged.
**.loRaNodes[*].app[0].typename = "SimpleLoRaApp"
**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].rng-0 = 0
**.loRaNodes[*].app[0].rng-1 = 1
**.loRaNodes[*].app[0].initialLoRaTP = select(intuniform(0, 6, 0), 2dBm, 4dBm, 6dBm, 8dBm, 10dBm, 12dBm, 14dBm)
**.loRaNodes[*].app[0].initialLoRaSF = intuniform(7, 12, 0)
**.loRaNodes[*].app[0].initialLoRaCF = 868.1MHz + intuniform(0, 2, 0) * 0.2MHz
**.loRaNodes[*].app[0].initialLoRaBW = 125kHz
**.loRaNodes[*].app[0].initialLoRaCR = 4

# The official v1.1 log-normal implementation uses its native hard-coded
# PL(d0)=127.41 dB. We only supply the paper's d0/gamma/sigma parameters.
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLoss.typename = "LoRaLogNormalShadowing"
**.LoRaMedium.pathLoss.d0 = 1000m
**.LoRaMedium.pathLoss.gamma = 2.32
**.LoRaMedium.pathLoss.sigma = 7.08
**.LoRaMedium.pathLoss.rng-0 = 3
**.LoRaMedium.rangeFilter = ""
**.LoRaMedium.neighborCache.typename = ""
**.minInterferenceTime = 0s

LoRaNetworkTest.**.radio.separateTransmissionParts = false
LoRaNetworkTest.**.radio.separateReceptionParts = false
**.ipv4Delayer.config = xmldoc("../work/flora/simulations/cloudDelays.xml")
**.displayAddresses = false

# Native official energy model. Its totalEnergyConsumed scalar includes the
# warm-up interval, so it is retained for diagnosis but is not compared as a
# paired energy endpoint with the corrected measurement-window accounting.
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].**.energySourceModule = "IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("../work/flora/simulations/energyConsumptionParameters.xml")

[Config OfficialMatchedStatic]
description = "Unmodified FLoRa 1.1 Legacy ADR; matched static scenario and initialization distributions"

